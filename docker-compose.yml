# DocSummarizer Docker Compose 配置
# 文档摘要总结服务 + Qdrant向量数据库

services:
  # DocSummarizer应用
  doc-summarizer:
    build: .
    container_name: doc-summarizer
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AI_EMBEDDINGSTORE_QDRANT_HOST=qdrant
      - AI_EMBEDDINGSTORE_QDRANT_PORT=6334
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-your-api-key-here}
    networks:
      - doc-summarizer-network
    restart: unless-stopped

  # Qdrant向量数据库
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - doc-summarizer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  doc-summarizer-network:
    driver: bridge

volumes:
  qdrant-data:
