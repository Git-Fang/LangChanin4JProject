<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小智Agent - 统一客户端</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/text-to-speech.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            height: 100vh;
            overflow: hidden;
            background-color: #f5f5f5;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* 左侧边栏 */
        .sidebar {
            width: 260px;
            background-color: #f7f7f7;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            max-height: 100vh;
        }

        .avatar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .app-name {
            font-size: 16px;
            font-weight: 500;
            color: #333;
            text-align: center;
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px 16px;
            background-color: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            color: #666;
            transition: all 0.2s;
            margin-bottom: 20px;
        }

        .new-chat-btn:hover {
            background-color: #f0f0f0;
            border-color: #d0d0d0;
        }

        .new-chat-btn::before {
            content: '+';
            font-size: 20px;
            font-weight: 300;
        }

        /* 模式切换按钮 */
        .mode-switch {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            background-color: white;
            color: #666;
            transition: all 0.2s;
            text-align: center;
        }

        .mode-btn:hover {
            background-color: #f0f0f0;
        }

        .mode-btn.active {
            background-color: #667eea;
            color: white;
            border-color: #667eea;
        }

        /* 历史会话列表 */
        .history-container {
            margin-top: 20px;
            flex-shrink: 0;
            overflow-y: auto;
            max-height: 224px;
        }

        .history-container.hidden {
            display: none;
        }

        .history-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            padding: 8px 12px;
            background-color: white;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: #333;
            transition: all 0.2s;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item:hover {
            background-color: #f0f0f0;
            border-color: #d0d0d0;
        }

        .history-item.active {
            background-color: #667eea;
            color: white;
            border-color: #667eea;
        }

        .delete-session-btn {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #f5f5f5;
            color: #999;
            font-size: 14px;
            font-weight: bold;
            line-height: 18px;
            text-align: center;
            cursor: pointer;
            margin-left: 8px;
            transition: all 0.2s;
            opacity: 0;
        }

        .history-item:hover .delete-session-btn {
            opacity: 1;
        }

        .delete-session-btn:hover {
            background-color: #ff4757;
            color: white;
        }

        .history-item.active .delete-session-btn {
            background-color: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .history-item.active:hover .delete-session-btn {
            background-color: #ff4757;
            color: white;
        }

        /* 文件上传区域 */
        .upload-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .upload-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .upload-btn {
            width: 100%;
            padding: 10px 16px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background-color 0.2s;
        }

        .upload-btn:hover {
            background-color: #5568d3;
        }

        .file-input {
            display: none;
        }

        /* 主聊天区域 */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: white;
            position: relative;
        }

        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mode-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #666;
        }

        .mode-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .mode-badge.http {
            background-color: #4caf50;
            color: white;
        }

        .mode-badge.sse {
            background-color: #2196f3;
            color: white;
        }

        .error-message {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #f44336;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            align-items: center;
            gap: 8px;
        }

        .error-message.show {
            display: flex;
            animation: slideDown 0.3s ease;
        }

        .retry-btn {
            padding: 6px 16px;
            background-color: white;
            color: #f44336;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .retry-btn:hover {
            background-color: #f5f5f5;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .message-actions {
            display: inline-flex;
            gap: 6px;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message:hover .message-actions {
            opacity: 1;
        }

        .message.assistant .message-actions {
            clear: both;
        }

        .message-actions-http {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            width: auto;
        }

        .message-http-wrapper {
            display: flex;
            flex-direction: column;
        }

        .message-http-user {
            align-items: flex-end;
        }

        .message-http-user .message-actions-http {
            justify-content: flex-end;
        }

        .message-content {
            background-color: #f5f5f5;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            color: #333;
            word-wrap: break-word;
            display: inline-block;
        }

        .message.user .message-content {
            background-color: #667eea;
            color: white;
        }

        .message.assistant .message-content {
            background-color: #f5f5f5;
            color: #333;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #ccc;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 输入区域 */
        .input-area {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #667eea;
        }

        .input-field:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }

        .send-btn {
            padding: 12px 24px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 500;
        }

        .send-btn:hover:not(:disabled) {
            background-color: #5568d3;
        }

        .send-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .chat-file-input {
            display: none;
        }

        .chat-file-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background-color: #f5f5f5;
            color: #666;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .chat-file-btn:hover {
            background-color: #e0e0e0;
            color: #333;
        }

        .chat-file-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-file-btn.has-files {
            background-color: #667eea;
            color: white;
        }

        .attached-files-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 20px;
            background-color: #f9f9f9;
            border-top: 1px solid #e0e0e0;
        }

        .attached-file-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background-color: white;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            font-size: 12px;
            color: #666;
        }

        .attached-file-item .file-name {
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .attached-file-item .remove-file {
            cursor: pointer;
            color: #999;
            font-size: 14px;
            line-height: 1;
        }

        .attached-file-item .remove-file:hover {
            color: #f44336;
        }

        .empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
        }

        /* SSE 工具面板 */
        .sse-panel {
            display: none;
            padding: 20px;
            background-color: #f9f9f9;
            border-top: 1px solid #e0e0e0;
        }

        .sse-panel.active {
            display: block;
        }

        .sse-panel h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .sse-control-group {
            margin-bottom: 15px;
        }

        .sse-control-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 13px;
        }

        .sse-control-group select,
        .sse-control-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 13px;
        }

        .sse-control-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .sse-btn {
            padding: 8px 16px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background-color 0.2s;
        }

        .sse-btn:hover {
            background-color: #5568d3;
        }

        .sse-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .sse-status {
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .sse-status.connected {
            background-color: #d4edda;
            color: #155724;
        }

        .sse-status.disconnected {
            background-color: #f8d7da;
            color: #721c24;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .tool-card {
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background-color: white;
        }

        .tool-card h4 {
            color: #333;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .tool-card p {
            color: #666;
            font-size: 12px;
            line-height: 1.4;
        }

        /* Markdown渲染样式 */
        .message-content h1 {
            font-size: 1.8em;
            font-weight: 600;
            margin: 0.8em 0 0.4em 0;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 0.3em;
        }

        .message-content h2 {
            font-size: 1.5em;
            font-weight: 600;
            margin: 0.7em 0 0.3em 0;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 0.2em;
        }

        .message-content h3 {
            font-size: 1.3em;
            font-weight: 600;
            margin: 0.6em 0 0.3em 0;
        }

        .message-content h4 {
            font-size: 1.1em;
            font-weight: 600;
            margin: 0.5em 0 0.3em 0;
        }

        .message-content h5 {
            font-size: 1em;
            font-weight: 600;
            margin: 0.4em 0 0.2em 0;
        }

        .message-content h6 {
            font-size: 0.9em;
            font-weight: 600;
            margin: 0.4em 0 0.2em 0;
            color: #666;
        }

        .message-content p {
            margin: 0.5em 0;
        }

        .message-content ul,
        .message-content ol {
            margin: 0.5em 0;
            padding-left: 1.5em;
        }

        .message-content ul {
            list-style-type: disc;
        }

        .message-content ol {
            list-style-type: decimal;
        }

        .message-content li {
            margin: 0.3em 0;
        }

        .message-content ul ul,
        .message-content ol ol,
        .message-content ul ol,
        .message-content ol ul {
            margin: 0.2em 0;
        }

        .message-content code {
            background-color: #f0f0f0;
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
        }

        .message-content pre {
            background-color: #2d2d2d;
            color: #f8f8f2;
            padding: 1em;
            border-radius: 6px;
            overflow-x: auto;
            margin: 0.8em 0;
        }

        .message-content pre code {
            background-color: transparent;
            padding: 0;
            color: inherit;
        }

        .message-content blockquote {
            border-left: 4px solid #667eea;
            padding-left: 1em;
            margin: 0.8em 0;
            color: #666;
            background-color: #f9f9f9;
            padding: 0.5em 1em;
            border-radius: 0 4px 4px 0;
        }

        .message-content a {
            color: #667eea;
            text-decoration: none;
        }

        .message-content a:hover {
            text-decoration: underline;
        }

        .message-content strong {
            font-weight: 600;
        }

        .message-content em {
            font-style: italic;
        }

        .message-content hr {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 1em 0;
        }

        .message-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 0.8em 0;
        }

        .message-content table th,
        .message-content table td {
            border: 1px solid #e0e0e0;
            padding: 0.5em 0.8em;
            text-align: left;
        }

        .message-content table th {
            background-color: #f5f5f5;
            font-weight: 600;
        }

        .message-content table tr:nth-child(even) {
            background-color: #fafafa;
        }

        .message-content img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 0.5em 0;
        }

        /* 日志容器样式 */
        .log-container {
            background-color: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 4px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            line-height: 1.6;
            margin-top: 15px;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 5px;
            border-left: 3px solid #667eea;
        }

        .log-entry.request {
            border-left-color: #4caf50;
        }

        .log-entry.response {
            border-left-color: #2196f3;
        }

        .log-entry.error {
            border-left-color: #f44336;
        }

        .log-entry .timestamp {
            color: #888;
            margin-right: 10px;
        }

        .log-entry .type {
            color: #667eea;
            margin-right: 10px;
            font-weight: bold;
        }

        /* 工具调用结果样式 */
        .tool-result-group {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .tool-result-container {
            background: #f8f9fa;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            max-height: 400px;
            overflow-y: auto;
        }

        .tool-result-markdown {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #333;
        }

        .message-actions {
            display: inline-flex;
            gap: 6px;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message:hover .message-actions {
            opacity: 1;
        }

        .message-action-btn {
            padding: 2px 8px;
            font-size: 0.7rem;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            color: #666;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .message-action-btn:hover {
            background: #f0f0f0;
            border-color: #ccc;
        }

        .message-action-btn.copied {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .message.user .message-action-btn {
            border-color: rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.15);
            color: white;
        }

        .message.user .message-action-btn:hover {
            background: rgba(255,255,255,0.25);
        }

        .message.user .message-action-btn.copied {
            background: #81c784;
            border-color: #81c784;
        }

        .message.assistant .message-action-btn {
            border-color: #ddd;
            background: white;
            color: #666;
        }

        .message.assistant .message-action-btn:hover {
            background: #f0f0f0;
            border-color: #ccc;
        }

        .message-action-btn.tts-btn {
            border-color: #667eea;
            color: #667eea;
        }

        .message-action-btn.tts-btn:hover {
            background: #667eea;
            color: white;
        }

        .message-action-btn.tts-btn.speaking {
            background: #667eea;
            color: white;
            animation: pulse 1s infinite;
        }

        .message-action-btn.stop-btn {
            border-color: #f44336;
            color: #f44336;
        }

        .message-action-btn.stop-btn:hover {
            background: #f44336;
            color: white;
        }

        .message-action-btn.stop-btn:disabled {
            background: #f5f5f5;
            color: #999;
            border-color: #ddd;
            cursor: not-allowed;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧边栏 -->
        <div class="sidebar">
            <div class="avatar-container">
                <div class="avatar">智</div>
                <div class="app-name">小智Agent</div>
            </div>
            
            <!-- 模式切换 -->
            <div class="mode-switch">
                <button class="mode-btn active" id="httpModeBtn" onclick="switchMode('http')">HTTP模式</button>
                <button class="mode-btn" id="sseModeBtn" onclick="switchMode('sse')">SSE模式</button>
            </div>
            
            <button class="new-chat-btn" onclick="newChat()">新会话</button>

            <!-- 历史会话列表 -->
            <div class="history-container">
                <h3 class="history-title">历史会话</h3>
                <div class="history-list" id="historyList">
                    <!-- 历史会话将通过JavaScript动态添加 -->
                </div>
            </div>

            <!-- SSE交流功能区域 -->
            <div class="upload-section" id="sseChatSection">
                <h3 class="upload-title">实时交流</h3>
                <button class="upload-btn" id="sseChatBtn" onclick="window.open('/chat-sse.html', '_blank')">SSE实时聊天</button>
            </div>

            <!-- 图文功能区域 -->
            <div class="upload-section" id="imageChatSection">
                <h3 class="upload-title">图文功能</h3>
                <button class="upload-btn" id="imageChatBtn" onclick="openImageChatModal()">图文交互</button>
            </div>

            <!-- 文件上传区域 -->
            <div class="upload-section" id="fileUploadSection">
                <h3 class="upload-title">文件管理</h3>
                <button class="upload-btn" onclick="const modal=document.getElementById('batchModal');if(modal)modal.style.display='flex'">批量上传文件</button>
            </div>

            <!-- 上传文档历史区域 -->
            <div class="upload-section" id="documentHistorySection">
                <h3 class="upload-title">文档查询</h3>
                <button class="upload-btn" onclick="window.open('/document-history.html', '_blank')">上传文档历史</button>
            </div>

            <!-- 配置更新区域 -->
            <div class="upload-section" id="configRefreshSection" style="margin-top: auto; padding-top: 20px; border-top: 1px solid #e0e0e0;">
                <h3 class="upload-title">配置更新</h3>
                <button class="upload-btn" id="configRefreshBtn" onclick="refreshConfig()">
                    <span id="refreshBtnIcon">🔄</span>
                    <span id="refreshBtnText">手动刷新配置</span>
                </button>
                <div id="configRefreshResult" style="margin-top: 8px; font-size: 12px; color: #666; display: none; word-break: break-all;"></div>
            </div>
        </div>

        <!-- 主聊天区域 -->
        <div class="chat-area">
            <div class="chat-header">
                <div class="mode-indicator">
                    当前模式: <span class="mode-badge http" id="modeBadge">HTTP</span>
                </div>
            </div>
            
            <div class="error-message" id="errorMessage">
                <span id="errorText">请求失败,请重试</span>
                <button class="retry-btn" id="retryBtn" onclick="retryLastMessage()">重试</button>
            </div>
            
            <div class="messages-container" id="messagesContainer">
                <div class="empty-state">开始新的对话吧</div>
            </div>

            <!-- SSE 工具面板 -->
            <div class="sse-panel" id="ssePanel">
                <h3>SSE 工具调用</h3>
                <div class="sse-status disconnected" id="sseStatus">未连接</div>
                
                <div class="sse-control-group">
                    <label>工具名称</label>
                    <select id="toolName">
                        <option value="">选择工具...</option>
                    </select>
                </div>
                
                <div class="sse-control-group">
                    <label>工具参数 (JSON格式)</label>
                    <textarea id="toolArguments"></textarea>
                </div>
                
                <div class="sse-control-group">
                    <button class="sse-btn" id="callToolBtn" onclick="callTool()" disabled>调用工具</button>
                </div>
                
                <!-- 工具调用结果 -->
                <div class="tool-result-group" id="toolResultGroup" style="display: none;">
                    <label>工具调用结果</label>
                    <div class="tool-result-container">
                        <div id="toolResultMarkdown" class="tool-result-markdown"></div>
                    </div>
                </div>
                
                <div class="sse-control-group">
                    <label>可用工具</label>
                    <div class="tools-grid" id="toolsGrid">
                        <p style="color: #999; font-size: 12px;">暂无工具，请先建立SSE连接</p>
                    </div>
                </div>
                
                <!-- 消息日志 -->
                <div class="sse-control-group">
                    <label>消息日志</label>
                    <button class="sse-btn" onclick="clearLog()" style="margin-bottom: 10px;">清空日志</button>
                    <div id="logContainer" class="log-container">
                        <div class="log-entry">
                            <span class="timestamp">--:--:--</span>
                            <span class="type">INFO</span>
                            <span class="message">日志已初始化</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <input
                    type="text"
                    class="input-field"
                    id="messageInput"
                    placeholder="请输入消息"
                    onkeypress="handleKeyPress(event)"
                >
                <input type="file" id="chatFileInput" class="chat-file-input" multiple
                       accept=".jpg,.jpeg,.png,.md,.doc,.docx,.pptx,.xlsx,.txt,.pdf"
                       onchange="handleChatFileSelect(event)">
                <button class="chat-file-btn" id="chatFileBtn" onclick="document.getElementById('chatFileInput').click()" title="上传附件">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                </button>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <script>
        // 全局状态
        let currentMode = 'http'; // 'http' 或 'sse'
        let memoryId = null;
        let eventSource = null;
        let sessionId = null;
        let messageId = 1;
        let tools = [];
        let lastMessage = null; // 保存最后发送的消息用于重试
        let lastUserMessage = null; // 保存最后一条用户消息用于AI重试
        let attachedFiles = []; // 附件文件列表
        let extractedTexts = []; // 提取的文件内容
        let httpController = null;
        let httpEventSource = null;
        let currentLoadingDiv = null;

        // 初始化memoryId - 使用sessionStorage保证同一页面会话连贯性
        function initMemoryId() {
            const storedMemoryId = sessionStorage.getItem('chatMemoryId');
            if (storedMemoryId) {
                memoryId = parseInt(storedMemoryId, 10);
            } else {
                memoryId = Date.now();
                sessionStorage.setItem('chatMemoryId', memoryId.toString());
            }
            console.log('初始化memoryId:', memoryId);
        }
        initMemoryId();

        // API 配置 - 使用动态地址以支持手机端和不同网络环境访问
        const getApiBaseUrl = () => {
            const protocol = window.location.protocol;
            const hostname = window.location.hostname;
            const port = window.location.port || (protocol === 'https:' ? '443' : '80');
            return `${protocol}//${hostname}:${port}`;
        };
        const API_BASE_URL = getApiBaseUrl();
        const HTTP_API_BASE_URL = `${API_BASE_URL}/mcp/exec`;
        const SSE_BASE_URL = `${API_BASE_URL}/mcp`;

        // 切换模式
        function switchMode(mode) {
            currentMode = mode;
            
            // 更新按钮状态
            document.getElementById('httpModeBtn').classList.toggle('active', mode === 'http');
            document.getElementById('sseModeBtn').classList.toggle('active', mode === 'sse');
            
            // 更新模式指示器
            const modeBadge = document.getElementById('modeBadge');
            modeBadge.textContent = mode === 'http' ? 'HTTP' : 'SSE';
            modeBadge.className = 'mode-badge ' + mode;
            
            // 显示/隐藏 SSE 面板
            const ssePanel = document.getElementById('ssePanel');
            ssePanel.classList.toggle('active', mode === 'sse');

            // 如果切换到 SSE 模式，自动建立连接
            if (mode === 'sse' && !eventSource) {
                connectSse();
            }
            
            // 如果切换到 HTTP 模式，断开 SSE 连接
            if (mode === 'http' && eventSource) {
                disconnectSse();
            }
        }

        // SSE 连接管理
        function generateSessionId() {
            return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function connectSse() {
            sessionId = generateSessionId();
            const sseUrl = `${SSE_BASE_URL}/sse?sessionId=${sessionId}`;
            
            addLog('INFO', `正在连接SSE: ${sseUrl}`, { sessionId });

            eventSource = new EventSource(sseUrl);

            eventSource.onopen = () => {
                updateSseStatus('connected');
                addLog('INFO', 'SSE连接已建立');
                
                // 自动初始化并获取工具列表
                setTimeout(() => {
                    quickInitialize();
                    setTimeout(() => quickToolsList(), 500);
                }, 500);
            };

            eventSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    addLog('RESPONSE', '收到SSE消息', data);
                    
                    // 处理工具列表响应
                    if (data.result && data.result.tools) {
                        tools = data.result.tools;
                        updateToolsList(tools);
                    }
                    
                    // 处理工具调用结果
                    if (data.result && data.result.content && Array.isArray(data.result.content)) {
                        displayToolResult(data.result);
                        
                        // 如果结果包含 chatResult，则添加到聊天区域
                        const content = data.result.content;
                        const textContent = content.find(item => item.type === 'text');
                        if (textContent && textContent.text) {
                            try {
                                const resultData = JSON.parse(textContent.text);
                                if (resultData.chatResult) {
                                    addMessage(resultData.chatResult, false);
                                }
                            } catch (e) {
                                // 如果不是 JSON，直接显示文本
                                addMessage(textContent.text, false);
                            }
                        }
                    }
                } catch (e) {
                    addLog('ERROR', '解析SSE消息失败: ' + e.message, event.data);
                }
            };

            eventSource.onerror = (error) => {
                updateSseStatus('disconnected');
                addLog('ERROR', 'SSE连接错误', error);
                disconnectSse();
            };
        }

        function disconnectSse() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
                updateSseStatus('disconnected');
                console.log('SSE连接已关闭');
            }
        }

        function updateSseStatus(status) {
            const statusEl = document.getElementById('sseStatus');
            const callToolBtn = document.getElementById('callToolBtn');
            
            statusEl.className = 'sse-status ' + status;
            
            if (status === 'connected') {
                statusEl.textContent = '已连接';
                callToolBtn.disabled = false;
            } else {
                statusEl.textContent = '未连接';
                callToolBtn.disabled = true;
            }
        }

        async function sendSseMessage(message, controller = null) {
            const messagesUrl = `${SSE_BASE_URL}/messages`;

            try {
                const fetchOptions = {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Session-ID': sessionId
                    },
                    body: JSON.stringify(message)
                };

                // 如果提供了 controller，使用其 signal
                if (controller) {
                    fetchOptions.signal = controller.signal;
                }

                const response = await fetch(messagesUrl, fetchOptions);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.text();
                if (data) {
                    const responseData = JSON.parse(data);
                    addLog('RESPONSE', '收到SSE响应', responseData);
                    return responseData;
                }
            } catch (error) {
                // 如果是被中止的，不记录日志
                if (error.name !== 'AbortError') {
                    addLog('ERROR', '发送SSE消息失败: ' + error.message);
                }
                throw error;
            }
        }

        function quickInitialize() {
            const message = {
                jsonrpc: "2.0",
                id: String(messageId++),
                method: "initialize",
                params: {
                    protocolVersion: "2024-11-05",
                    capabilities: {},
                    clientInfo: {
                        name: "UnifiedClient",
                        version: "1.0.0"
                    }
                }
            };
            sendSseMessage(message);
        }

        function quickToolsList() {
            const message = {
                jsonrpc: "2.0",
                id: String(messageId++),
                method: "tools/list"
            };
            sendSseMessage(message);
        }

        function updateToolsList(toolsData) {
            const grid = document.getElementById('toolsGrid');
            const select = document.getElementById('toolName');
            
            // 清空现有内容
            grid.innerHTML = '';
            select.innerHTML = '<option value="">选择工具...</option>';
            
            // 更新全局工具列表
            tools = toolsData;
            
            // 添加工具卡片
            toolsData.forEach(tool => {
                // 生成参数模板
                let paramTemplate = '{}';
                if (tool.inputSchema && tool.inputSchema.properties) {
                    const properties = tool.inputSchema.properties;
                    const required = tool.inputSchema.required || [];
                    const params = {};
                    
                    for (const [key, schema] of Object.entries(properties)) {
                        if (schema.type === 'string') {
                            params[key] = required.includes(key) ? '' : (schema.description || '');
                        } else if (schema.type === 'number' || schema.type === 'integer') {
                            params[key] = required.includes(key) ? 0 : (schema.minimum || 0);
                        } else if (schema.type === 'boolean') {
                            params[key] = false;
                        } else if (schema.type === 'array') {
                            params[key] = [];
                        } else {
                            params[key] = null;
                        }
                    }
                    paramTemplate = JSON.stringify(params, null, 2);
                }
                
                // 存储参数模板到工具对象
                tool.paramTemplate = paramTemplate;
                
                const card = document.createElement('div');
                card.className = 'tool-card';
                card.innerHTML = `
                    <h4>${tool.name}</h4>
                    <p>${tool.description || '暂无描述'}</p>
                    <div style="margin-top: 10px; font-size: 12px; color: #666;">
                        <strong>参数模板:</strong>
                        <pre style="background: #f5f5f5; padding: 8px; border-radius: 4px; overflow-x: auto;">${paramTemplate}</pre>
                    </div>
                `;
                grid.appendChild(card);
                
                // 添加到下拉列表
                const option = document.createElement('option');
                option.value = tool.name;
                option.textContent = tool.name;
                select.appendChild(option);
            });
            
            // 添加工具选择变化事件
            select.onchange = function() {
                const selectedToolName = this.value;
                if (selectedToolName) {
                    const selectedTool = tools.find(t => t.name === selectedToolName);
                    if (selectedTool && selectedTool.paramTemplate) {
                        document.getElementById('toolArguments').value = selectedTool.paramTemplate;
                        addLog('INFO', `已选择工具: ${selectedToolName}，参数模板已自动填充`);
                    }
                } else {
                    document.getElementById('toolArguments').value = '';
                }
            };
            
            addLog('INFO', `已更新工具列表，共 ${toolsData.length} 个工具`);
        }

        function callTool() {
            const toolName = document.getElementById('toolName').value;
            const argumentsText = document.getElementById('toolArguments').value;

            if (!toolName) {
                alert('请选择工具');
                return;
            }

            let argumentsObj = {};
            try {
                if (argumentsText.trim()) {
                    argumentsObj = JSON.parse(argumentsText);
                }
            } catch (e) {
                alert('参数JSON格式错误: ' + e.message);
                return;
            }

            const message = {
                jsonrpc: "2.0",
                id: String(messageId++),
                method: "tools/call",
                params: {
                    name: toolName,
                    arguments: argumentsObj
                }
            };
            
            sendSseMessage(message);
        }

        function displayToolResult(result) {
            const resultGroup = document.getElementById('toolResultGroup');
            const resultContainer = document.getElementById('toolResultMarkdown');
            
            resultGroup.style.display = 'block';
            
            // 格式化显示结果
            let resultText = '';
            if (typeof result === 'string') {
                resultText = result;
            } else if (result.content && Array.isArray(result.content)) {
                // 处理MCP标准响应格式
                resultText = result.content.map(item => {
                    if (item.type === 'text') {
                        return item.text;
                    } else if (item.type === 'image') {
                        return `[图片: ${item.data.substring(0, 50)}...]`;
                    }
                    return JSON.stringify(item);
                }).join('\n\n');
            } else {
                resultText = JSON.stringify(result, null, 2);
            }
            
            // 使用marked库渲染Markdown
            resultContainer.innerHTML = marked.parse(resultText);
            addLog('INFO', '工具调用结果已显示');
        }

        // 显示错误消息
        function showError(message, showRetry = true) {
            const errorEl = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const retryBtn = document.getElementById('retryBtn');
            
            errorText.textContent = message || '请求失败,请重试';
            errorEl.classList.add('show');
            retryBtn.style.display = showRetry ? 'inline-block' : 'none';
            
            setTimeout(() => {
                errorEl.classList.remove('show');
            }, 5000);
        }

        // 添加日志
        function addLog(type, message, data = null) {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type.toLowerCase();
            
            const now = new Date();
            const timestamp = now.toTimeString().split(' ')[0];
            
            let content = `<span class="timestamp">${timestamp}</span>`;
            content += `<span class="type">${type}</span>`;
            content += `<span class="message">${message}</span>`;
            
            if (data) {
                content += `<pre style="margin-top: 5px; padding: 5px; background-color: #1a1a1a; border-radius: 3px; overflow-x: auto;">${JSON.stringify(data, null, 2)}</pre>`;
            }
            
            entry.innerHTML = content;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }

        // 清空日志
        function clearLog() {
            const container = document.getElementById('logContainer');
            container.innerHTML = '';
            addLog('INFO', '日志已清空');
        }

        // 添加消息到聊天区域
        function addMessage(content, isUser) {
            const container = document.getElementById('messagesContainer');
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;
            messageDiv.dataset.content = content;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = isUser ? '我' : '智';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            // 如果是助手消息，使用markdown解析
            if (!isUser) {
                contentDiv.innerHTML = marked.parse(content);
            } else {
                contentDiv.textContent = content;
            }

            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'message-actions';
            if (!isUser && currentMode === 'http') {
                actionsDiv.classList.add('message-actions-http');
            }

                const copyBtn = document.createElement('button');
                copyBtn.className = 'message-action-btn copy-btn';
                copyBtn.innerHTML = '<span>📋</span> 复制';
                copyBtn.onclick = () => copyMessage(content, copyBtn);

                actionsDiv.appendChild(copyBtn);

                // HTTP 模式下添加停止按钮
                if (!isUser && currentMode === 'http') {
                    const stopBtn = document.createElement('button');
                    stopBtn.className = 'message-action-btn stop-btn';
                    stopBtn.innerHTML = '<span>⏹</span> 停止';
                    stopBtn.onclick = () => stopStreaming(stopBtn, messageDiv);
                    actionsDiv.appendChild(stopBtn);
                }

                // SSE 模式下添加停止按钮
                if (!isUser && currentMode === 'sse') {
                    const stopBtn = document.createElement('button');
                    stopBtn.className = 'message-action-btn stop-btn';
                    stopBtn.innerHTML = '<span>⏹</span> 停止';
                    stopBtn.onclick = () => stopSseStreaming(stopBtn, messageDiv);
                    actionsDiv.appendChild(stopBtn);
                }

            if (isUser) {
                const editRetryBtn = document.createElement('button');
                editRetryBtn.className = 'message-action-btn retry-btn';
                editRetryBtn.innerHTML = '<span>🔄</span> 编辑重试';
                editRetryBtn.onclick = () => retryWithEdit(content);
                actionsDiv.appendChild(editRetryBtn);
            } else {
                const retryBtn = document.createElement('button');
                retryBtn.className = 'message-action-btn retry-btn';
                retryBtn.innerHTML = '<span>🔄</span> 重试';
                retryBtn.onclick = () => retryWithSameQuestion();
                actionsDiv.appendChild(retryBtn);

                const ttsBtn = document.createElement('button');
                ttsBtn.className = 'message-action-btn tts-btn';
                ttsBtn.innerHTML = '<span>🔊</span> 播报';
                ttsBtn.onclick = () => toggleSpeech(messageDiv, ttsBtn);
                actionsDiv.appendChild(ttsBtn);
            }

            if (isUser) {
                const wrapperDiv = document.createElement('div');
                wrapperDiv.className = 'message-http-wrapper message-http-user';
                
                const userContentDiv = document.createElement('div');
                userContentDiv.className = 'message-content';
                userContentDiv.textContent = content;
                
                const userActionsDiv = document.createElement('div');
                userActionsDiv.className = 'message-actions message-actions-http';
                
                const userCopyBtn = document.createElement('button');
                userCopyBtn.className = 'message-action-btn copy-btn';
                userCopyBtn.innerHTML = '<span>📋</span> 复制';
                userCopyBtn.onclick = () => copyMessage(content, userCopyBtn);
                
                const userRetryBtn = document.createElement('button');
                userRetryBtn.className = 'message-action-btn retry-btn';
                userRetryBtn.innerHTML = '<span>🔄</span> 编辑重试';
                userRetryBtn.onclick = () => retryWithEdit(content);
                
                userActionsDiv.appendChild(userCopyBtn);
                userActionsDiv.appendChild(userRetryBtn);
                
                wrapperDiv.appendChild(userContentDiv);
                wrapperDiv.appendChild(userActionsDiv);
                messageDiv.appendChild(avatar);
                messageDiv.appendChild(wrapperDiv);
            } else if (!isUser && currentMode === 'http') {
                const wrapperDiv = document.createElement('div');
                wrapperDiv.className = 'message-http-wrapper';
                wrapperDiv.appendChild(contentDiv);
                wrapperDiv.appendChild(actionsDiv);
                messageDiv.appendChild(avatar);
                messageDiv.appendChild(wrapperDiv);
            } else if (!isUser && currentMode === 'sse') {
                const wrapperDiv = document.createElement('div');
                wrapperDiv.className = 'message-http-wrapper';
                wrapperDiv.appendChild(contentDiv);
                wrapperDiv.appendChild(actionsDiv);
                messageDiv.appendChild(avatar);
                messageDiv.appendChild(wrapperDiv);
            } else {
                messageDiv.appendChild(avatar);
                messageDiv.appendChild(contentDiv);
                messageDiv.appendChild(actionsDiv);
            }
            container.appendChild(messageDiv);

            // 滚动到底部
            container.scrollTop = container.scrollHeight;

            return messageDiv;
        }

        function copyMessage(content, btn) {
            // 优先使用dataset中存储的最新内容，其次从DOM获取
            const messageElement = btn.closest('.message');
            const latestContent = messageElement?.dataset?.content;
            const contentDiv = messageElement?.querySelector('.message-content');
            const domContent = contentDiv?.textContent;

            // 按优先级获取内容：dataset.content > DOM textContent > 原始参数
            const textToCopy = latestContent || domContent || content;

            navigator.clipboard.writeText(textToCopy).then(() => {
                btn.classList.add('copied');
                btn.innerHTML = '<span>✓</span> 已复制';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.innerHTML = '<span>📋</span> 复制';
                }, 2000);
            }).catch(err => {
                console.error('复制失败:', err);
                alert('复制失败，请手动选择文本复制');
            });
        }

        function stopStreaming(stopBtn, messageElement) {
            // 从消息元素获取控制器引用
            const controller = messageElement?._controller;
            const eventSource = messageElement?._eventSource;

            // 中止 HTTP 请求
            if (controller) {
                controller.abort();
                messageElement._controller = null;
            }

            // 关闭 EventSource
            if (eventSource) {
                eventSource.close();
                messageElement._eventSource = null;
            }

            // 禁用停止按钮
            stopBtn.disabled = true;
            stopBtn.innerHTML = '<span>⏹</span> 已停止';

            // 标记消息已完成
            messageElement.dataset.stopped = 'true';

            // 移除当前消息的复制和停止按钮
            const actionsDiv = messageElement?.querySelector('.message-actions');
            if (actionsDiv) {
                const copyBtn = actionsDiv.querySelector('.copy-btn');
                const stopBtnInActions = actionsDiv.querySelector('.stop-btn');
                if (copyBtn) copyBtn.style.display = 'none';
                if (stopBtnInActions) stopBtnInActions.remove();

                tipDiv.textContent = '已手动停止';
                actionsDiv.appendChild(tipDiv);
            }

            console.log('已停止流式接收');
        }

        function stopSseStreaming(stopBtn, messageElement) {

            // 标记消息已完成

            const actionsDiv = messageElement?.querySelector('.message-actions');

                const copyBtn = actionsDiv.querySelector('.copy-btn');
                const stopBtnInActions = actionsDiv.querySelector('.stop-btn');
                if (copyBtn) copyBtn.style.display = 'none';
                if (stopBtnInActions) stopBtnInActions.remove();

                // 添加完成提示
                const tipDiv = document.createElement('div');

        function toggleSpeech(messageElement, button) {
            const contentDiv = messageElement.querySelector('.message-content');
            const content = contentDiv ? contentDiv.textContent : '';

            if (TextToSpeech.isSpeaking()) {
                TextToSpeech.stop();
                button.classList.remove('speaking');
                button.innerHTML = '<span>🔊</span> 播报';
            } else {
                TextToSpeech.speak(content, {
                    lang: 'zh-CN',
                    rate: 1,
                    pitch: 1,
                    volume: 1
                });
                button.classList.add('speaking');
                button.innerHTML = '<span>🔊</span> 停止';
            }

            const originalOnEnd = TextToSpeech.currentUtterance?.onend;
            if (TextToSpeech.currentUtterance) {
                TextToSpeech.currentUtterance.onend = function() {
                    button.classList.remove('speaking');
                    button.innerHTML = '<span>🔊</span> 播报';
                    if (originalOnEnd) originalOnEnd.call(this);
                };
            }

        function retryWithSameQuestion() {

        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            let message = input.value.trim();

            if (!message && attachedFiles.length === 0) {
                return;
            }

            if (!message) {
                alert('请输入消息内容');
                return;
            }

            if (attachedFiles.length > 0 && extractedTexts.length === 0) {
                const extractSuccess = await extractFileContent();
                if (!extractSuccess) {
                    return;
                }
            }

            if (attachedFiles.length > 0 && extractedTexts.length > 0) {
                message = `用户问题：${message}\n\n附件内容：\n${extractedTexts.map((text, i) => `--- 文件 ${i + 1} ---\n${text}`).join('\n\n')}`;
            }

            lastMessage = message;
            lastUserMessage = input.value.trim();

            input.disabled = true;
            sendBtn.disabled = true;
            sendBtn.textContent = '发送中...';

            addMessage(lastUserMessage, true);
            input.value = '';

            clearAttachedFiles();

            const loadingDiv = addMessage('正在思考...', false);
            currentLoadingDiv = loadingDiv;
            const contentDiv = loadingDiv.querySelector('.message-content');
            const loadingIndicator = document.createElement('span');
            loadingIndicator.className = 'loading';
            contentDiv.appendChild(loadingIndicator);

            try {
                let replyText = '';

                if (currentMode === 'http') {
                    // HTTP 模式 - 使用 POST + SSE 流式接口
                    const controller = new AbortController();
                    loadingDiv._controller = controller;
                    const timeoutId = setTimeout(() => controller.abort(), 300000);

                    const initResponse = await fetch(`${API_BASE_URL}/xiaozhi/chat/http-stream`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            memoryId: memoryId,
                            message: message,
                            extractedTexts: extractedTexts.length > 0 ? extractedTexts : null
                        }),
                        signal: controller.signal
                    });

                    clearTimeout(timeoutId);

                    if (!initResponse.ok) {
                        const errorText = await initResponse.text();
                        console.error('HTTP Error:', initResponse.status, errorText);
                        throw new Error(errorText || `HTTP error! status: ${initResponse.status}`);
                    }

                    const { requestId: streamRequestId, streamUrl } = await initResponse.json();
                    
                    const streamUrlFull = `${API_BASE_URL}${streamUrl}`;
                    console.log('HTTP流式请求ID:', streamRequestId, 'URL:', streamUrlFull);
                    
                    const eventSource = new EventSource(streamUrlFull);
                    loadingDiv._eventSource = eventSource;
                    let accumulatedContent = '';
                    let httpStreamComplete = false;
                    
                    eventSource.addEventListener('connected', async (e) => {
                        console.log('HTTP SSE 连接已建立');
                        addLog('INFO', 'HTTP流式连接已建立');
                    });
                    
                    eventSource.addEventListener('chunk', async (e) => {
                        // 检查是否已手动停止
                        if (loadingDiv.dataset.stopped === 'true') {
                            eventSource.close();
                            loadingDiv._eventSource = null;
                            loadingDiv._controller = null;
                            return;
                        }

                        try {
                            const data = JSON.parse(e.data);
                            console.log('收到HTTP流式内容块:', data);
                            
                            if (data.content) {
                                accumulatedContent += data.content;
                                contentDiv.textContent = accumulatedContent;
                                loadingDiv.dataset.content = accumulatedContent;
                                
                                const container = document.getElementById('messagesContainer');
                                container.scrollTop = container.scrollHeight;
                            }
                            
                            if (data.progress !== undefined) {
                                contentDiv.dataset.progress = data.progress;
                            }
                        } catch (error) {
                            console.error('解析HTTP流式内容块失败:', error);
                        }
                    });
                    
                    eventSource.addEventListener('result', async (e) => {
                        // 检查是否已手动停止
                        if (loadingDiv.dataset.stopped === 'true') {
                            eventSource.close();
                            loadingDiv._eventSource = null;
                            loadingDiv._controller = null;
                            return;
                        }

                        try {
                            const result = JSON.parse(e.data);
                            console.log('收到HTTP流式结果:', result);
                            
                            httpStreamComplete = true;
                            
                            if (result.status === 'SUCCESS' || result.status === 'success') {
                                if (result.result && accumulatedContent !== result.result) {
                                    accumulatedContent = result.result;
                                }
                                
                                contentDiv.innerHTML = marked.parse(accumulatedContent);
                                contentDiv.dataset.content = accumulatedContent;
                                
                                const processingTimeDiv = document.createElement('div');
                                processingTimeDiv.style.cssText = 'font-size: 0.75rem; color: #999; margin-top: 4px;';
                                processingTimeDiv.textContent = '处理耗时: ' + (result.processingTimeMs || 0) + 'ms';
                                contentDiv.appendChild(processingTimeDiv);
                                
                                lastMessage = null;
                            } else {
                                addMessage('处理失败: ' + (result.error || '未知错误'), false);
                            }
                            
                            eventSource.close();
                            loadingDiv._eventSource = null;
                            loadingDiv._controller = null;
                            
                            loadHistorySessions();
                        } catch (error) {
                            console.error('解析HTTP流式结果失败:', error);
                        }
                    });
                    
                    eventSource.addEventListener('complete', (e) => {
                        console.log('HTTP SSE 流完成');
                        if (!httpStreamComplete) {
                            // 检查是否已手动停止
                            if (loadingDiv.dataset.stopped === 'true') {
                                eventSource.close();
                                loadingDiv._eventSource = null;
                                loadingDiv._controller = null;
                                return;
                            }

                            if (accumulatedContent) {
                                contentDiv.innerHTML = marked.parse(accumulatedContent);
                            }
                            eventSource.close();
                            loadingDiv._eventSource = null;
                            loadingDiv._controller = null;
                        }
                    });
                    
                    eventSource.addEventListener('error', (error) => {
                        console.error('HTTP SSE 错误:', error);
                        httpStreamComplete = true;

                        // 检查是否已手动停止
                        if (loadingDiv.dataset.stopped === 'true') {
                            eventSource.close();
                            loadingDiv._eventSource = null;
                            loadingDiv._controller = null;
                            return;
                        }

                        if (loadingDiv && loadingDiv.parentNode) {
                            loadingDiv.remove();
                        }
                        addMessage('抱歉，服务暂时不可用，请稍后重试。', false);

                        eventSource.close();
                        loadingDiv._eventSource = null;
                        loadingDiv._controller = null;
                    });
                    
                    eventSource.onerror = (error) => {
                        console.error('HTTP SSE 底层错误:', error);
                    };
                    
                    return;
                } else {
                    // SSE 模式
                    const sseController = new AbortController();
                    loadingDiv._sseController = sseController;

                    const sseMessage = {
                        jsonrpc: "2.0",
                        id: String(messageId++),
                        method: "tools/call",
                        params: {
                            name: "composite_intelligent_agent",
                            arguments: {
                                memoryId: memoryId,
                                userMessage: message
                            }
                        }
                    };
                    
                    // 记录发送的消息到日志
                    addLog('REQUEST', '发送SSE消息', sseMessage);
                    
                    try {
                        await sendSseMessage(sseMessage, sseController);
                    } catch (error) {
                        // 检查是否是手动停止
                        if (loadingDiv.dataset.stopped === 'true') {
                            console.log('SSE 请求已手动停止');
                            loadingDiv._sseController = null;
                            return;
                        }
                        throw error;
                    }

                    // 请求完成，清除控制器
                    loadingDiv._sseController = null;
                }
            } catch (error) {
                console.error('Error:', error);
                console.error('Error stack:', error.stack);
                
                // 检查是否是手动停止
                if (loadingDiv?.dataset?.stopped === 'true') {
                    console.log('请求已手动停止');
                    return;
                }
                
                let errorMsg = '请求失败,请重试';
                let showRetry = true;
                if (error.name === 'AbortError') {
                    errorMsg = '请求已取消';
                    showRetry = false;
                } else if (error.message) {
                    errorMsg = error.message.length > 50 ? '请求失败,请重试' : error.message;
                }
                
                // SSE模式错误时也显示重试按钮
                if (currentMode === 'sse') {
                    showError(errorMsg, showRetry);
                } else {
                    showError(errorMsg, showRetry);
                }
                
                // 移除加载消息
                if (loadingDiv && loadingDiv.parentNode) {
                    loadingDiv.remove();
                }
                
                // 添加错误提示消息
                addMessage('抱歉，服务暂时不可用，请稍后重试。', false);
            } finally {
                // 恢复输入和按钮
                input.disabled = false;
                sendBtn.disabled = false;
                sendBtn.textContent = '发送';
                input.focus();
            }
        }

        // 处理回车键
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // 处理聊天页面文件选择
        async function handleChatFileSelect(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const validFiles = Array.from(files).filter(file => {
                const ext = file.name.split('.').pop().toLowerCase();
                const validExts = ['jpg', 'jpeg', 'png', 'md', 'doc', 'docx', 'pptx', 'xlsx', 'txt', 'pdf'];
                return validExts.includes(ext) && file.size <= 5 * 1024 * 1024;
            });

            if (validFiles.length === 0) {
                alert('请选择有效的文件（支持 jpg/jpeg/png/md/doc/docx/pptx/xlsx/txt/pdf，单文件不大于5MB）');
                event.target.value = '';
                return;
            }

            if (validFiles.length > 3) {
                alert('最多支持上传 3 个文件');
                validFiles.splice(3);
            }

            attachedFiles = [...attachedFiles, ...validFiles];
            updateAttachedFilesPreview();

            document.getElementById('chatFileBtn').classList.add('has-files');
            event.target.value = '';
        }

        // 更新附件预览显示
        function updateAttachedFilesPreview() {
            let previewContainer = document.getElementById('attachedFilesPreview');
            if (!previewContainer) {
                previewContainer = document.createElement('div');
                previewContainer.id = 'attachedFilesPreview';
                previewContainer.className = 'attached-files-preview';
                const inputArea = document.querySelector('.input-area');
                inputArea.parentNode.insertBefore(previewContainer, inputArea.nextSibling);
            }

            if (attachedFiles.length === 0) {
                previewContainer.remove();
                document.getElementById('chatFileBtn').classList.remove('has-files');
                return;
            }

            previewContainer.innerHTML = attachedFiles.map((file, index) => `
                <div class="attached-file-item">
                    <span class="file-name" title="${file.name}">${file.name}</span>
                    <span class="remove-file" onclick="removeAttachedFile(${index})">×</span>
                </div>
            `).join('');
        }

        // 移除附件
        function removeAttachedFile(index) {
            attachedFiles.splice(index, 1);
            extractedTexts.splice(index, 1);
            updateAttachedFilesPreview();
        }

        // 提取文件内容
        async function extractFileContent() {
            if (attachedFiles.length === 0) return true;

            const fileCount = attachedFiles.length;
            let allSuccess = true;
            extractedTexts = [];

            try {
                document.getElementById('sendBtn').disabled = true;
                document.getElementById('sendBtn').textContent = '提取中...';

                // 分离图片文件和非图片文件
                const imageFiles = attachedFiles.filter(file => {
                    const ext = file.name.split('.').pop().toLowerCase();
                    return ['jpg', 'jpeg', 'png'].includes(ext);
                });
                const nonImageFiles = attachedFiles.filter(file => {
                    const ext = file.name.split('.').pop().toLowerCase();
                    return !['jpg', 'jpeg', 'png'].includes(ext);
                });

                // 处理非图片文件
                if (nonImageFiles.length > 0) {
                    const formData = new FormData();
                    nonImageFiles.forEach(file => {
                        formData.append('files', file);
                    });

                    const response = await fetch('/xiaozhi/chat/extract', {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();

                    if (result.success && result.extractedTexts) {
                        extractedTexts = [...extractedTexts, ...result.extractedTexts];
                        console.log('非图片文件内容提取成功，共提取 ' + result.extractedTexts.length + ' 个文件');
                    } else {
                        console.error('非图片文件提取失败:', result.message);
                        alert('非图片文件提取失败: ' + (result.message || '未知错误'));
                        allSuccess = false;
                    }
                }

                // 处理图片文件
                for (const file of imageFiles) {
                    try {
                        const imageText = await processImageFile(file);
                        extractedTexts.push(imageText);
                        console.log('图片文件处理成功: ' + file.name);
                    } catch (error) {
                        console.error('图片文件处理失败:', error);
                        alert('图片文件处理失败: ' + error.message);
                        allSuccess = false;
                    }
                }

            } catch (error) {
                console.error('文件提取异常:', error);
                alert('文件提取失败: ' + error.message);
                allSuccess = false;
            } finally {
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('sendBtn').textContent = '发送';
            }

            return allSuccess;
        }

        // 处理图片文件，使用专门的图片理解接口
        async function processImageFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const base64Data = e.target.result.split(',')[1];
                        const imageType = file.type.split('/')[1] || 'png';

                        const formData = new FormData();
                        formData.append('base64Data', base64Data);
                        formData.append('imageType', imageType);
                        formData.append('prompt', '请详细描述这张图片的内容，包括图片中的物体、场景、颜色、布局等所有可见信息。不要只检测文字内容，要描述整个图片的视觉内容。');

                        console.log('发送图片处理请求:', {
                            imageType: imageType,
                            base64Length: base64Data.length,
                            prompt: formData.get('prompt')
                        });

                        // 增加重试机制
                        const maxRetries = 3;
                        let retryCount = 0;
                        let lastError = null;

                        while (retryCount < maxRetries) {
                            try {
                                console.log(`图片处理尝试 ${retryCount + 1}/${maxRetries}`);
                                
                                const response = await fetch('/xiaozhi/chatImage', {
                                    method: 'POST',
                                    body: formData,
                                    timeout: 120000 // 120秒超时
                                });

                                if (!response.ok) {
                                    const errorText = await response.text();
                                    console.error('图片处理失败:', response.status, errorText);
                                    throw new Error('图片处理失败: ' + errorText);
                                }

                                const resultText = await response.text();
                                console.log('图片处理结果:', resultText);
                                resolve('[图片内容] ' + resultText);
                                return;
                            } catch (error) {
                                console.error(`图片处理尝试 ${retryCount + 1} 失败:`, error);
                                lastError = error;
                                retryCount++;

                                // 如果是超时错误，等待后重试
                                if (retryCount < maxRetries) {
                                    const delay = Math.pow(2, retryCount) * 1000; // 指数退避
                                    console.log(`等待 ${delay}ms 后重试...`);
                                    await new Promise(resolve => setTimeout(resolve, delay));
                                }
                            }
                        }

                        // 所有重试都失败
                        console.error('所有图片处理尝试都失败');
                        reject(lastError || new Error('图片处理失败: 所有尝试都失败'));
                    } catch (error) {
                        console.error('图片处理异常:', error);
                        reject(error);
                    }
                };
                reader.onerror = function(error) {
                    console.error('文件读取失败:', error);
                    reject(error);
                };
                reader.readAsDataURL(file);
            });
        }
