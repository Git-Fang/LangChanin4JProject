# Nacos Config Bootstrap配置
# 此文件在application.yml之前加载，用于配置Nacos配置中心的连接
# Spring Cloud 2023.x + Spring Boot 3.x + Spring Cloud Alibaba 2023.x

spring:
  application:
    name: RAGTranslationApplication
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:docker}

  # Nacos Config 配置中心
  cloud:
    nacos:
      config:
        # Nacos服务器地址
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        # 命名空间ID（可选）
        namespace: ${NACOS_NAMESPACE:}
        # 配置分组
        group: DEFAULT_GROUP
        # 文件后缀格式
        type: yaml
        # 是否开启配置自动刷新
        auto-refresh: true
        # 配置共享（可选）
        shared-configs:
          - data-id: common.yml
            group: DEFAULT_GROUP
            refresh: true

      # Nacos Discovery 服务注册
      discovery:
        # Nacos服务器地址
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        # 命名空间ID（可选）
        namespace: ${NACOS_NAMESPACE:}
        # 服务分组
        group: DEFAULT_GROUP
        # 服务名称（使用应用名称）
        service: ${spring.application.name}
        # 集群名称
        cluster-name: ${SPRING_PROFILES_ACTIVE:docker}
        # 权重（可选）
        weight: 1
        # 是否开启服务注册
        enabled: true

  # 禁用Spring Cloud兼容性检查（Spring Boot 3.x兼容）
  cloud_compatibility_verifier:
    enabled: false

# 兼容性配置
compatibility-verifier:
  enabled: false
