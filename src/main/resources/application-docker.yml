server:
  port: 8100
  address: 0.0.0.0
  servlet:
    encoding:
      charset: utf-8
      force: true
      enabled: true
    context-parameters:
      tomcat-servlet:
        async-supported: true
  tomcat:
    connection-timeout: 180000
    max-http-header-size: 65536
    max-http-form-post-size: 100MB

spring:
  web:
    timeout: 240s
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# SSE配置
sse:
  timeout: 240000

# AI配置 - Qdrant向量数据库配置
ai:
  embeddingStore:
    qdrant:
      collectionName: ${AI_EMBEDDINGSTORE_QDRANT_COLLECTIONNAME:doc-summarizer}
      host: ${AI_EMBEDDINGSTORE_QDRANT_HOST:localhost}
      port: ${AI_EMBEDDINGSTORE_QDRANT_PORT:6334}
      timeout: ${AI_EMBEDDINGSTORE_QDRANT_TIMEOUT:30}

  dashscope:
    apiKey: ${DASHSCOPE_API_KEY:sk-ca175397022a41a9926ffe30b1faac81}
    model: qwen-max
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    timeout: 300s
    max-retries: 3

# 摘要配置
summarization:
  prompt-template: summarization-prompt

# 日志配置
logging:
  level:
    root: INFO
    org.fb: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
