# Docker环境Prometheus配置文件
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 应用程序指标 (Docker环境使用服务名)
  - job_name: 'rag-translation'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['rag-translation:8000']

  # MongoDB指标
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # Redis指标
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
