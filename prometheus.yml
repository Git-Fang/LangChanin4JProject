# Prometheus配置文件
global:
  scrape_interval: 15s  # 抓取间隔
  evaluation_interval: 15s  # 评估间隔

# 抓取配置
scrape_configs:
  # 抓取Prometheus自身的指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 抓取Kafka的指标（暂时禁用，因为没有配置JMX Exporter）
  # - job_name: 'kafka'
  #   static_configs:
  #     - targets: ['kafka:9308']

  # 抓取应用程序的指标
  - job_name: 'rag-translation'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8000']  # 当应用作为独立容器运行时使用host.docker.internal
    # 如果应用也在docker compose中运行，则取消下面的注释并注释上面一行
    # - targets: ['ragtranslation-app:8000']

  # 抓取MongoDB的指标
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter-monitoring:9216']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # 抓取Redis的指标
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter-monitoring:9121']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # 抓取Qdrant的指标
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
