# 本地开发环境Prometheus配置文件
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 应用程序指标 (本地环境使用localhost)
  - job_name: 'rag-translation-local'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['localhost:8000']

  # MongoDB指标 (本地Exporter)
  - job_name: 'mongodb-local'
    static_configs:
      - targets: ['localhost:9216']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # Redis指标 (本地Exporter)
  - job_name: 'redis-local'
    static_configs:
      - targets: ['localhost:9121']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
