services:
  # MongoDB
  mongo:
    image: mongo:7
    container_name: mongo-monitoring
    ports:
      - "27018:27017"
    volumes:
      - mongo-monitoring-data:/data/db
    networks:
      - monitoring-network

  # MongoDB Exporter
  mongodb-exporter:
    image: percona/mongodb_exporter:0.39.0
    container_name: mongodb-exporter-monitoring
    ports:
      - "9216:9216"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/admin?directConnection=true
      - MONGODB_EXPORTER_COLLECT_ALL=true
      - MONGODB_EXPORTER_COMPATIBLE_MODE=true
    command: [
      "--mongodb.uri=mongodb://mongo:27017/admin?directConnection=true",
      "--collect-all",
      "--compatible-mode"
    ]
    depends_on:
      - mongo
    networks:
      - monitoring-network

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus-monitoring
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring-network

  # Grafana
  grafana:
    image: grafana/grafana:10.1.10
    container_name: grafana-monitoring
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana-monitoring-data:/var/lib/grafana
    networks:
      - monitoring-network

networks:
  monitoring-network:
    driver: bridge

volumes:
  mongo-monitoring-data:
  grafana-monitoring-data: