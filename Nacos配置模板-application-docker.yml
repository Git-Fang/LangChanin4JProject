# Nacos配置模板 - application-docker.yml
# ==========================================
# 使用说明：
# 1. 登录Nacos控制台: http://localhost:8848/nacos (nacos/nacos)
# 2. 进入"配置管理" -> "配置列表"
# 3. 点击"+创建新配置"
# 4. 填写以下信息:
#    - Data ID: application-docker.yml
#    - Group: DEFAULT_GROUP
#    - 配置格式: YAML
#    - 配置内容: 复制下面的完整内容
# ==========================================

server:
  port: 8000
  address: 0.0.0.0
  servlet:
    encoding:
      charset: utf-8
      force: true
      enabled: true
    context-parameters:
      tomcat-servlet:
        async-supported: true
  tomcat:
    connection-timeout: 180000
    max-http-header-size: 65536
    max-http-form-post-size: 100MB

spring:
  application:
    name: RAGTranslationApplication
  config:
    import:
      - optional:nacos:application-docker.yml
  web:
    timeout: 240s
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    name: defaultDataSource
    url: jdbc:mysql://host.docker.internal:3306/mydocker?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

  data:
    mongodb:
      uri: mongodb://mongo:27017/chat_db

  redis:
    host: redis
    port: 6379

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: admin

  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: ai-chat-consumer-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    listener:
      ack-mode: manual
      concurrency: 5

  cloud:
    nacos:
      config:
        server-addr: nacos:8848
        namespace: ""
        group: DEFAULT_GROUP
        data-id: application-docker.yml
        type: yaml
        auto-refresh: true
      discovery:
        server-addr: nacos:8848
        namespace: ""
        group: DEFAULT_GROUP
        service: RAGTranslationApplication
        cluster-name: docker

sse:
  timeout: 240000

kafka:
  topics:
    request: ai-chat-request
    result: ai-chat-result
    dlq: ai-dlq
  consumer-groups:
    request: ai-request-consumer
    result: ai-result-consumer

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      table-underline: true

ai:
  deepSeek:
    base-url: https://api.deepseek.com/v1
    model: deepseek-chat
    apiKey: sk-3077c6547df74bd6bcb66d4ea4a2589e
  ollama:
    base-url: http://localhost:11434
    model: deepseek-r1:8b
  kimi:
    base-url: https://api.moonshot.cn/v1
    model: kimi-k2-turbo-preview
    apiKey: sk-iHnlk244Ic6mia74KyVl8r4dxuymAeWP6sKk2xiPj4BYSRAx
  embeddingStore:
    qdrant:
      collectionName: ragTranslation-1226
      host: qdrant
      port: 6334
  dashscope:
    apiKey: sk-ca175397022a41a9926ffe30b1faac81
    model: qwen-vl-max
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  mcp:
    baiduMap:
      apiKey: 8qM3bsI6oakw1ICy1g1T9Vo0peSP90of

logging:
  level:
    root: INFO
    org.fb: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [traceId=%X{traceId}/spanId=%X{spanId}] %-5level %logger{36} - %msg%n"

tracing:
  sampling:
    probability: 1.0
  enabled: true
  propagation:
    type: w3c
